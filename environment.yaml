# HAES Conda Environment
# Reproducible training environment specification
# Tested on: Tesla A100 40GB, NVIDIA Driver 535.104.05, CUDA 12.1

name: haes
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10.13
  - pip=23.3.1
  - cuda-toolkit=12.1
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1
  - numpy=1.26.2
  - scipy=1.11.4
  - scikit-learn=1.3.2
  - pandas=2.1.4
  - pyyaml=6.0.1
  - tqdm=4.66.1
  - tensorboard=2.14.0
  - opencv=4.8.1
  - einops=0.7.0
  - pip:
    - ffmpeg-python==0.2.0
    - matplotlib==3.8.2
    - seaborn==0.13.0
    - pytest==7.4.3
